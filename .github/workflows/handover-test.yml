name: Handover test (temporary)
on: workflow_dispatch
permissions:
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3 pillow==10.4.0 && python -c "import sys; sys.path.insert(0,'scraper'); import scrape; scrape.relaunch()"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
