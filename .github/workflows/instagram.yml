# "Update Instagram" button: puts a new video from @blackebergp11_rod at the top of the Instagram section on Översikt.
# In Instagram: open the video > Share > Copy link. In the GitHub app (or github.com): Actions > Update Instagram >
# Run workflow > paste the link > Run. Without a link it tries to read the newest videos from the profile itself,
# but Instagram usually refuses GitHub's servers (429), so the link is the reliable way.
name: Update Instagram

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Länk till den nya videon (i Instagram: Dela > Kopiera länk)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pillow==10.4.0
      - name: Fetch the newest videos
        env:
          INSTA_LINK: ${{ inputs.link }}
        run: python scraper/scrape.py --insta
