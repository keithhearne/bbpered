# Keeps data.json up to date from Profixio and Cup Manager.
# Wakes twice an hour; scraper/scrape.py decides whether there is anything to do:
#  - nightly full check (first run after 03:00 Swedish time) for new fixtures and changes, and for new
#    competitions P11 Röd has been entered into on Profixio (e.g. a new USM round)
#  - Fridays–Sundays daytime: a check at least every 5 hours
#  - game days: a run up to 3 hours before tip-off stays on, then checks the score every 2 minutes for about
#    1.5 hours from tip-off (live.json on the "live" branch; data.json every 15 min and when a game ends);
#    hourly catch-up afterwards
#  GitHub sometimes skips scheduled runs, so the checks are based on "how long since the last update"
#  rather than exact times.
# Free on a public repository. Run it by hand from the Actions tab ("Run workflow").
name: Update data

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, because GitHub sometimes skips scheduled runs
  workflow_dispatch:
    inputs:
      force:
        description: "Do a full update now"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pillow==10.4.0
      # A browser is only needed for the nightly check for new competitions (and manual runs).
      - name: Plan
        id: plan
        env:
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
        run: python scraper/scrape.py --plan
      - name: Install browser for the competition check
        if: ${{ steps.plan.outputs.browser == 'true' }}
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Fetch data
        env:
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lets the job write live.json to the "live" branch
        run: python scraper/scrape.py
