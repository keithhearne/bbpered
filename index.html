<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P11 Röd</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e3e4e8">
<meta name="description" content="Matcher, resultat, tabell och statistik för Blackeberg P11 Röd.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Barlow:wght@400;600;700;800&display=swap">
<style>
/* Layout: navy club bar with four tabs, one column of match rows below; red is the accent, logo red for wins and our row. */
:root {
  color-scheme: light;
  --bar: #e3e4e8;          /* light grey menu bar */
  --bar-ink: #c8102e;      /* club red text */
  --bar-muted: #c27a85;
  --card: #ffffff;
  --card-ink: #c8102e;
  --card-soft: #fdf0f1;
  --card-muted: #6b6f7f;
  --court: #c8102e;
  --accent: #d0142c;       /* club red */
  --logo-red: #a8182e;     /* badge red */
  --bg: #ffffff;           /* white page, as in the logo */
  --surface: #ffffff;
  --ink: #15161c;
  --muted: #5d6070;
  --line: #e1e2e8;
  --win: #1d6b45;
  --loss: #a8182e;
  --hi: #f5c9d0;           /* our row, stronger than the stripes */
  --row-grey: #ececef;      /* a touch lighter than the menu bar so they look alike */
  --row-red: #fdeef0;
  --chip: #efeff2;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--line); box-shadow: 0 6px 18px rgb(20 24 39 / .08); }
.brand { display: flex; align-items: center; gap: 12px; padding-block: 12px 4px; }
.brand img { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.brand .name { font-family: var(--display); font-size: 1.7rem; line-height: 1; letter-spacing: .02em; }
.brand .sub { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--bar-muted); }
nav.tabs { display: flex; justify-content: space-between; gap: 4px; }
nav.tabs button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--bar-muted); font-family: var(--display); font-size: clamp(1.05rem, 4.6vw, 1.6rem); letter-spacing: .03em; padding: 10px 2px 12px; cursor: pointer; position: relative; }
nav.tabs button[aria-selected="true"] { color: var(--bar-ink); }
nav.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: 0; height: 4px; border-radius: 4px 4px 0 0; background: var(--accent); }

main { padding-block: 20px 48px; }
section[role="tabpanel"] { display: grid; gap: 28px; }
.page-title { font-family: var(--display); font-size: 3rem; line-height: .95; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); }

.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.eyebrow b { color: var(--ink); }
.eyebrow.red { color: var(--accent); }

.h2 { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 2rem; line-height: 1; margin: 0 0 4px; }
.h2::before { content: ""; width: 24px; height: 24px; flex: none; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11.5' fill='%23d0142c'/><path d='M6.3 3.2Q2.6 12 6.3 20.8M17.7 3.2Q21.4 12 17.7 20.8M1.5 12H5.4M18.6 12H22.5M12 1.5V4.8M12 19.2V22.5' fill='none' stroke='%23fff' stroke-width='1.5' stroke-linecap='round'/><text x='12' y='16.9' text-anchor='middle' font-family='Arial Black,Arial,Helvetica,sans-serif' font-weight='900' font-size='14' fill='%23fff' stroke='%23d0142c' stroke-width='1.6' paint-order='stroke'>B</text></svg>") center / contain no-repeat; }
/* Red line under a section heading (Matchspel page), same look as Senaste 3 / Trupp */
.h2.under { margin-bottom: 14px; padding-bottom: 4px; border-bottom: 3px solid var(--accent); }
.h2.rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Next-match card */
.next { border-radius: 16px; overflow: hidden; background: var(--card); color: var(--card-ink); position: relative; border: 2px solid var(--accent); box-shadow: 0 10px 24px rgb(168 24 46 / .14); }
.next .band { display: flex; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--logo-red); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.next .body { position: relative; padding: 20px 20px 22px; display: grid; gap: 16px; }
.next svg.court { position: absolute; right: -40px; top: 0; height: 100%; width: auto; opacity: .12; pointer-events: none; color: var(--court); }
.next .date { font-size: .9rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--card-muted); margin: 0; }
.next .opp { font-family: var(--display); font-size: clamp(2.3rem, 10vw, 3.2rem); line-height: .95; margin: 2px 0 0; text-wrap: balance; position: relative; }
.times { display: flex; gap: 12px; flex-wrap: wrap; position: relative; }
.time { border-radius: 10px; padding: 10px 16px 6px; min-width: 120px; }
.time .k { font-size: .7rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.time .v { font-family: var(--display); font-size: 2.6rem; line-height: 1; }
.time.start { background: var(--accent); color: #fff; }
.time.count { background: var(--card-soft); color: var(--card-ink); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; position: relative; }
.facts dt { color: var(--card-muted); }
.facts dd { margin: 0; font-weight: 700; min-width: 0; }
.cta { color: var(--card-ink); font-weight: 700; position: relative; }

/* Match rows */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.day { text-align: center; line-height: 1; }
.day .wd { font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.day .d { font-family: var(--display); font-size: 2.1rem; display: block; margin: 2px 0; }
.day .m { font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mid { min-width: 0; }
.mid .t { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
.mid .s { color: var(--muted); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { text-align: right; }
.right .clock { font-family: var(--display); font-size: 2rem; line-height: 1; }
.ha { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ha.home { color: var(--accent); }
.score { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.score .n { font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score.w .n { color: var(--win); }
.score.l .n { color: var(--loss); }
.pill { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-family: var(--display); font-size: 1.2rem; flex: none; }
.pill.w { background: var(--win); }
.pill.l { background: var(--loss); }

/* Summary chips */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .k { font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 6px; flex-wrap: wrap; }

/* Table */
.tbl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tbl-head .h2 { font-size: 1.8rem; }
.place { font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; }
.tbl-wrap { overflow-x: auto; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th { background: var(--surface); color: var(--accent); border-bottom: 3px solid var(--accent); font-family: var(--display); font-weight: 400; font-size: 1.3rem; letter-spacing: .04em; padding: 12px 8px; text-align: right; }
thead th.l { text-align: left; }
td { padding: 11px 8px; border-top: 1px solid var(--line); text-align: right; }
td.l { text-align: left; }
td.pos { color: var(--muted); width: 2.2em; text-align: center; }
td.team { font-weight: 600; }
tbody td { background: var(--row-grey); border-top: 2px solid var(--bg); }
.tbl-wrap { border: 0; }
.roster { gap: 2px !important; border-radius: 14px; overflow: hidden; }
.roster .player { background: var(--row-grey); border-bottom: 0; padding-left: 10px; padding-right: 12px; }
tr.us td { background: var(--hi) !important; font-weight: 800; }
#kalender .list .row, #oversikt .list .row, #resultat .list .row { padding-left: 10px; padding-right: 12px; background: var(--row-grey); border-bottom: 2px solid var(--bg); }
#kalender .list .row:last-child, #oversikt .list .row:last-child, #resultat .list .row:last-child { border-bottom: 0; }
#oversikt .list, #resultat .list { border-radius: 14px; overflow: hidden; }
#oversikt .list .row { padding-top: 9px; padding-bottom: 9px; gap: 12px; grid-template-columns: 42px minmax(0, 1fr) auto; }
#oversikt .list .day .d { font-size: 1.75rem; margin: 1px 0; }
#oversikt .list .day .wd, #oversikt .list .day .m { font-size: .66rem; }
#oversikt .list .mid .t { font-size: 1rem; }
#oversikt .list .mid .s { font-size: .85rem; }
#oversikt .list .right .clock, #oversikt .list .score .n { font-size: 1.75rem; }
#oversikt .list .mlinks { gap: 4px 10px; margin-top: 2px; }
#oversikt .list .mplay { padding: 2px 9px; font-size: .78rem; }
#oversikt .list .pill { width: 26px; height: 26px; font-size: 1.05rem; }
.stat { background: var(--card-soft); border: 0; border-radius: 14px; padding: 12px 14px; }
.stat .v { color: var(--accent); }
.board .stat { background: var(--surface); }
#oversikt .list, #resultat .list, #kalender .list, .roster { border-top: 3px solid var(--accent); border-radius: 0 0 14px 14px !important; }
#tabeller tbody td { background: var(--row-grey); border-top: 2px solid var(--bg); }
#tabeller .tbl-wrap { border: 0; }
#kalender .list { border-radius: 14px; overflow: hidden; }
tr.us td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
.plus { color: var(--win); } .minus { color: var(--loss); }
.extra { display: none; }
.wide .extra { display: table-cell; }
.toggle { background: var(--chip); border: 0; border-radius: 999px; padding: 8px 14px; font: 700 .85rem var(--body); color: var(--ink); cursor: pointer; }
.note { color: var(--muted); font-size: .85rem; }
.src { color: var(--muted); font-size: .85rem; }
.example { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: .85rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { section[role="tabpanel"] { animation: in .25s ease-out; } @keyframes in { from { transform: translateY(6px); opacity: .6; } } }

/* Laget */
.team-hero { display: flex; align-items: center; gap: 16px; }
.team-hero img { width: 84px; height: 84px; border-radius: 50%; flex: none; }
.team-hero .n { font-family: var(--display); font-size: 2.6rem; line-height: .95; margin: 0; color: var(--accent); }
.team-hero .s { color: var(--muted); font-weight: 600; }
.team-photo { margin: 0; border-radius: 14px; overflow: hidden; background: var(--line); aspect-ratio: 560 / 315; }
.team-photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.photo-slot { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--muted); font-size: .9rem; text-align: center; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 0 20px; }
.player { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.jersey { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: #fff; font-family: var(--display); font-size: 1.6rem; line-height: 1; }
.jersey.none { background: var(--chip); color: var(--muted); font-size: 1.1rem; }
.player .pn { font-weight: 700; overflow-wrap: anywhere; }
.player .py { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.staff { display: flex; flex-wrap: wrap; gap: 10px; }
.staff span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.staff b { color: var(--accent); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; margin-right: 6px; }

/* Next match v3: notched ticket on a full-court plan */
.ticket { position: relative; background: var(--card-soft); color: var(--ink); padding: 22px 20px 18px; display: grid; gap: 18px; border-radius: 18px; overflow: hidden; }
.ticket svg.ball { position: absolute; right: -70px; top: -50px; width: 290px; height: 290px; color: var(--court); opacity: .13; pointer-events: none; transform: rotate(-18deg); }
.ticket > *:not(svg) { position: relative; }
.ticket .tag { justify-self: start; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.ticket .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.datetile { background: var(--accent); color: #fff; border-radius: 4px 4px 22px 4px; width: 78px; padding: 8px 0 6px; text-align: center; line-height: 1; }
.datetile span { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.datetile b { display: block; font-family: var(--display); font-weight: 400; font-size: 2.9rem; margin: 2px 0; }
.ticket .vs { margin: 0; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ticket h2 { margin: 2px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 9.5vw, 3rem); line-height: .95; color: var(--accent); text-wrap: balance; }
.tiles { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr) minmax(0, .8fr); gap: 8px; }
.tiles > div { background: var(--surface); border-radius: 10px; padding: 10px 12px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.tiles .k { font-size: .66rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tiles .v { font-family: var(--display); font-size: 1.9rem; line-height: 1; color: var(--ink); }
.tiles .v.sm { font-family: var(--body); font-size: .85rem; font-weight: 700; line-height: 1.25; padding-top: 4px; overflow-wrap: break-word; }
.ticket .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.ticket .foot a { color: var(--accent); font-weight: 700; }

/* Matchspel */
.mlinks { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mplay { background: var(--card-soft); border: 0; border-radius: 999px; padding: 4px 11px; font: 700 .85rem var(--body); color: var(--muted); cursor: pointer; transition: color .15s; }
.mplay:hover, .mplay:focus-visible, .mplay:active { color: var(--accent); }
.mid .s.links { white-space: normal; }
.back { justify-self: start; background: var(--card-soft); border: 0; border-radius: 999px; padding: 8px 14px; font: 700 .9rem var(--body); color: var(--muted); cursor: pointer; transition: color .15s; }
.back:hover, .back:focus-visible, .back:active { color: var(--accent); }
#match { display: grid; gap: 26px; }
#match[hidden] { display: none; }
.board { background: var(--card-soft); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 14px; }
.board .meta { font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.vsrow { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; align-items: center; }
.vsrow .tm { font-weight: 800; font-size: 1rem; line-height: 1.2; overflow-wrap: anywhere; }
.vsrow .tm.r { text-align: right; }
.vsrow .tm.us { color: var(--accent); }
.big { font-family: var(--display); font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qs { display: grid; grid-template-columns: auto repeat(4, minmax(0,1fr)); gap: 4px 8px; font-variant-numeric: tabular-nums; font-size: .9rem; }
.qs .hd { font-size: .68rem; font-weight: 800; letter-spacing: .12em; color: var(--muted); text-align: center; }
.qs .nm { font-weight: 700; white-space: nowrap; }
.qs .c { text-align: center; background: var(--surface); border-radius: 6px; padding: 3px 0; }
.qs .c.won { color: var(--accent); font-weight: 800; }
.flow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 8px; }
.flow svg { width: 100%; height: auto; display: block; }
.flow .cap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-top: 6px; }
.scorers { display: grid; gap: 10px; }
.scorer { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.scorer .jersey, .scorer .avatar { grid-row: span 2; }
.scorer .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.scorer .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.scorer .pn { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.scorer .py { color: var(--muted); font-weight: 400; font-size: .85rem; }
.scorer .pts { font-family: var(--display); font-size: 1.6rem; line-height: 1; }
.seg { display: flex; background: var(--chip); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-width: 0; border: 0; background: none; border-radius: 999px; padding: 8px 6px; font: 700 .85rem var(--body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--line); }
.ev { display: grid; grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr); align-items: center; gap: 6px; padding: 4px 0; position: relative; }
.ev .sc { grid-column: 2; grid-row: 1; justify-self: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev .sc b { color: var(--accent); }
.card { grid-row: 1; border-radius: 10px; padding: 7px 10px; min-width: 0; font-size: .85rem; line-height: 1.25; }
.card .what { font-weight: 800; }
.card .who { overflow-wrap: anywhere; }
.card .tm { font-size: .72rem; opacity: .75; }
.ev.us .card { grid-column: 1; text-align: right; }
.ev.them .card { grid-column: 3; }
.card.p { background: var(--accent); color: #fff; }
.ev.them .card.p { background: #5d6070; }
.card.f { background: var(--chip); color: var(--ink); }
.card.t { background: var(--bg); border: 1.5px dashed var(--muted); color: var(--muted); }
.card.p.three { outline: 2px solid var(--accent); outline-offset: 2px; }
.ev.them .card.p.three { outline-color: #5d6070; }
.mark { display: flex; justify-content: center; padding: 10px 0; position: relative; }
.mark span { background: var(--ink); color: var(--bg); border-radius: 8px; padding: 5px 12px; font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; text-align: center; }
.mark span b { display: block; font-family: var(--display); font-size: 1.3rem; letter-spacing: .02em; font-weight: 400; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

.cc-name { font-size: .74rem; font-weight: 600; line-height: 1.2; color: var(--ink); margin-top: 2px; }

/* live games */
.livedot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; animation: livepulse 1.4s ease-in-out infinite; }
@keyframes livepulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .livedot { animation: none; } }
.sbscore small.lv { color: var(--accent); background: #fff; border-radius: 999px; padding: 2px 6px 1px; letter-spacing: .1em; }
.livepill { display: inline-block; font: 800 .7rem/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 999px; padding: 4px 8px 3px; }
.board .big.lv { color: var(--ink); }
.eyebrow.updated { margin: 4px 0 0; text-align: center; line-height: 1.6; }

/* competition colour accents (same colours as the competition labels) */
.cc-serie { --cc: #1a447d; --cc-bg: #dde8f7; }
.cc-usm { --cc: #9a5d00; --cc-bg: #fbe8c8; }
.cc-cup { --cc: #4f3280; --cc-bg: #e9e0f8; }
.cc-x { --cc: #0d5c63; --cc-bg: #d8f0f1; }
.ticket.next-up[class*="cc-"] .tag { border-color: var(--cc); color: var(--cc); background: var(--cc-bg); }
.ticket.next-up[class*="cc-"] .tiles > div { box-shadow: inset 0 -3px 0 var(--cc); }
a.cupbadge { text-decoration: none; -webkit-tap-highlight-color: transparent; }
a.cupbadge small { font-family: var(--body); font-size: .75em; font-weight: 700; margin-left: 2px; }
a.cupbadge:active { transform: scale(.95); }
a.cupbadge:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>

const tabs = [...document.querySelectorAll('[role="tab"]')];
function show(id) {
  if (!document.getElementById(id)) id = "oversikt";
  tabs.forEach(t => { const on = t.dataset.tab === id; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; document.getElementById(t.dataset.tab).hidden = !on; });

  window.scrollTo(0, 0);
}

function parseEvents(id) {
  return PBP[id].ev.split(";").map(s => { const [p, side, code, num, h, a, t] = s.split(","); return { p: +p, side, code, num, h: +h, a: +a, t }; });
}
function localClock(m, t) {
  if (!t) return "";
  const d = new Date(`${m.date}T${t.slice(0, 2)}:${t.slice(2)}:00Z`);
  try { return d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Stockholm" }); } catch (e) { return t.slice(0, 2) + ":" + t.slice(2); }
}

function openMatch(id) {
  backToStats = false;
  const m = matches.find(x => x.id === id); if (!m || !PBP[id]) return;
  window.__openMatch = id;
  const P = PBP[id], ev = parseEvents(id);
  const usSide = m.home ? "h" : "a";
  const name = (side, num) => P.names[side + num] || "";
  const usName = "Blackeberg Röd", themName = m.opp;
  const ourScore = e => usSide === "h" ? e.h : e.a, theirScore = e => usSide === "h" ? e.a : e.h;
  const isPts = e => /^[123]$/.test(e.code);

  // Points per period
  const per = {}; let last = { h: 0, a: 0 };
  ev.forEach(e => { if (e.code === "E" || e.code === "X") { per[e.p] = { h: e.h - last.h, a: e.a - last.a }; last = { h: e.h, a: e.a }; } });
  const periods = [1, 2, 3, 4].map(p => per[p] || { h: 0, a: 0 });
  const usP = periods.map(x => usSide === "h" ? x.h : x.a), thP = periods.map(x => usSide === "h" ? x.a : x.h);

  // Lead over the game, one step per basket
  const scoring = ev.filter(isPts);
  const pts = [{ i: 0, d: 0, p: 1 }].concat(scoring.map((e, i) => ({ i: i + 1, d: ourScore(e) - theirScore(e), p: e.p })));
  const maxAbs = Math.max(10, ...pts.map(x => Math.abs(x.d)));
  const step = maxAbs > 40 ? 20 : 10, lim = Math.ceil(maxAbs / step) * step;
  const W = 600, H = 180, padL = 38, padR = 10, padT = 10, padB = 24;
  const X = i => padL + (W - padL - padR) * i / (pts.length - 1);
  const Y = d => padT + (H - padT - padB) * (1 - (d + lim) / (2 * lim));
  const line = pts.map((q, k) => `${k ? "L" : "M"}${X(q.i).toFixed(1)} ${Y(q.d).toFixed(1)}`).join(" ");
  const area = `${line} L${X(pts.length - 1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const ticks = []; for (let v = -lim; v <= lim; v += step) ticks.push(v);
  const qLines = [2, 3, 4].map(p => { const k = pts.findIndex(q => q.p === p); return k > 0 ? `<line x1="${X(k - .5)}" x2="${X(k - .5)}" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-opacity=".5" stroke-dasharray="3 4"/><text x="${X(k - .5) + 4}" y="${H - 7}" font-size="12" fill="var(--muted)">P${p}</text>` : ""; }).join("");
  const best = Math.max(...pts.map(q => q.d)), worst = Math.min(...pts.map(q => q.d));
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Blackebergs ledning eller underläge under matchen">
    <defs><clipPath id="above"><rect x="0" y="0" width="${W}" height="${Y(0)}"/></clipPath><clipPath id="below"><rect x="0" y="${Y(0)}" width="${W}" height="${H}"/></clipPath></defs>
    ${ticks.map(v => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 2 : 1}"/><text x="${padL - 6}" y="${Y(v) + 4}" font-size="12" text-anchor="end" fill="var(--muted)">${v > 0 ? "+" + v : v}</text>`).join("")}
    <text x="${padL - 6 + 4}" y="${H - 7}" font-size="12" fill="var(--muted)">P1</text>${qLines}
    <path d="${area}" fill="var(--accent)" fill-opacity=".22" clip-path="url(#above)"/>
    <path d="${area}" fill="#5d6070" fill-opacity=".2" clip-path="url(#below)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(pts[pts.length - 1].d)}" r="4.5" fill="var(--accent)"/></svg>`;

  // Blackeberg scorers
  const sc = {};
  ev.filter(e => e.side === usSide && isPts(e)).forEach(e => { const k = e.num; sc[k] = sc[k] || { num: k, pts: 0, three: 0, ft: 0 }; sc[k].pts += +e.code; if (e.code === "3") sc[k].three++; if (e.code === "1") sc[k].ft++; });
  const scorers = Object.values(sc).sort((a, b) => b.pts - a.pts || (+a.num - +b.num));
  const top = scorers.length ? scorers[0].pts : 1;
  const extra = s => [s.three ? `${s.three} trepoängare` : "", s.ft ? `${s.ft} straff` : ""].filter(Boolean).join(" · ");

  const evHtml = () => ev.filter(e => {
    if (e.side === "-") return true;
    if (matchFilter === "us") return e.side === usSide;
    if (matchFilter === "them") return e.side !== usSide;
    return true;
  }).map(e => {
    const sh = `${ourScore(e)}–${theirScore(e)}`;
    if (/^\?Byte/.test(e.code)) return ""; // substitutions: not shown
    if (e.code === "S") return `<li class="mark"><span>${e.p === 1 ? "Matchstart" : "Start period " + e.p}</span></li>`;
    if (e.code === "E") return `<li class="mark"><span>${e.p === 2 ? "Halvtid" : "Slut period " + e.p}<b>${sh}</b></span></li>`;
    if (e.code === "X") return `<li class="mark"><span>Matchen är slut<b>${sh}</b></span></li>`;
    const mine = e.side === usSide;
    const teamLabel = mine ? usName : esc(themName);
    const who = e.num !== "" && name(e.side, e.num) ? `#${esc(e.num)} ${esc(name(e.side, e.num))}` : teamLabel;
    let cls = "f", what;
    if (isPts(e)) { cls = "p" + (e.code === "3" ? " three" : ""); what = e.code === "1" ? "Straff · 1 poäng" : e.code + " poäng"; }
    else if (e.code === "F") what = "Personlig foul";
    else if (e.code === "T") { cls = "t"; what = "Timeout"; }
    else what = e.code.slice(1).replace(/_/g, " ").replace("Coachteknisk", "Teknisk foul, coach");
    const chip = isPts(e) ? `<span class="sc"><b>${ourScore(e)}</b>–${theirScore(e)}</span>` : "";
    return `<li class="ev ${mine ? "us" : "them"}"><div class="card ${cls}"><div class="what">${what}</div><div class="who">${e.code === "T" ? teamLabel : who}</div><div class="tm">${localClock(m, e.t)}</div></div>${chip}</li>`;
  }).join("");

  const el = document.getElementById("match");
  el.innerHTML = `
    <button class="back" type="button" id="backbtn">← Tillbaka</button>
    <div class="board">
      <div class="btop"><div class="meta">${WDL[m.d.getDay()]} ${m.d.getDate()} ${MONL[m.d.getMonth()]} · ${m.home ? "Hemma" : "Borta"} · ${(SERIES[m.series] || SERIES.serie).head}</div><a class="plink" href="${matchUrl(m)}" target="_blank" rel="noopener">Profixio ↗</a></div>
      <div class="vsrow"><div class="tm us">${usName}</div><div class="big ${m.live ? "lv" : m.win ? "w" : "l"}">${m.played ? m.us : m.liveUs}–${m.played ? m.them : m.liveThem}${m.live ? `<span class="livepill">Live</span>` : `<span class="pill ${m.win ? "w" : "l"}">${m.win ? "V" : "F"}</span>`}</div><div class="tm r">${esc(themName)}</div></div>
      <div class="qs"><span></span>${[1, 2, 3, 4].map(p => `<span class="hd">P${p}</span>`).join("")}
        <span class="nm">Blackeberg</span>${usP.map((v, k) => `<span class="c ${v > thP[k] ? "won" : ""}">${v}</span>`).join("")}
        <span class="nm">Motståndare</span>${thP.map(v => `<span class="c">${v}</span>`).join("")}</div>
    </div>
    <div><h2 class="h2 under">Matchens förlopp</h2>
      <div class="flow">${chart}<div class="cap"><span>Över linjen: Blackeberg leder</span><span>Störst ledning ${best > 0 ? "+" + best : "–"} · störst underläge ${worst < 0 ? worst : "–"}</span></div></div></div>
    <div><h2 class="h2 under">Poäng Blackeberg</h2><div class="scorers">${scorers.map(s => `<div class="scorer">${photoOf(name(usSide, s.num)) ? `<span class="avatar"><img src="${photoOf(name(usSide, s.num))}" alt=""><b>${esc(s.num)}</b></span>` : `<span class="jersey">${esc(s.num)}</span>`}<span class="pn">${esc(name(usSide, s.num))}${extra(s) ? ` <span class="py">· ${extra(s)}</span>` : ""}</span><span class="pts">${s.pts}</span><span class="bar"><i style="width:${(s.pts / top * 100).toFixed(0)}%"></i></span></div>`).join("") || '<p class="note">Inga poäng registrerade.</p>'}</div></div>
    <div><h2 class="h2 under">Matchspel</h2>
      <div class="seg" role="group" aria-label="Visa händelser">
        <button type="button" data-f="us">Blackeberg</button><button type="button" data-f="alla">Alla</button><button type="button" data-f="them">Motståndare</button></div>
      <div class="legend" style="margin:12px 0 6px"><span><i style="background:var(--accent)"></i>Blackeberg</span><span><i style="background:#5d6070"></i>${esc(themName)}</span><span><i style="background:var(--chip)"></i>Foul</span></div>
      <ul class="tl" id="tl"></ul></div>
    <p class="note">Från Profixios matchlogg. Klockslagen visar när händelsen registrerades. <a href="${matchUrl(m)}" target="_blank" rel="noopener">Öppna matchen hos Profixio ↗</a></p>`;
  const segBtns = [...el.querySelectorAll(".seg button")];
  const setF = f => { matchFilter = f; segBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === f)); document.getElementById("tl").innerHTML = evHtml(); };
  segBtns.forEach(b => b.addEventListener("click", () => setF(b.dataset.f)));
  setF(matchFilter);
  document.getElementById("backbtn").addEventListener("click", closeMatch);
  const cur = tabs.find(t => t.getAttribute("aria-selected") === "true");
  lastTab = cur ? cur.dataset.tab : "oversikt";
  document.querySelectorAll('section[role="tabpanel"]').forEach(s => s.hidden = true);
  el.hidden = false; window.scrollTo(0, 0);
}
function closeMatch() {
  if (backToStats) { openSeason(); return; }
  document.getElementById("match").hidden = true;
  show(lastTab);
}
document.addEventListener("click", e => { if (e.target.closest("a[href]")) return; const tl = e.target.closest("[data-table]"); if (tl) { e.stopPropagation(); goTable(tl.dataset.table); return; } const b = e.target.closest("[data-match]"); if (b) openMatch(b.dataset.match); });

// Season player stats, built from the match logs (PBP) and the line-ups (who was on the score sheet).
function buildStats() {
  const P = {};
  const get = (name, num) => (P[name] = P[name] || { name, nums: new Set(), gp: 0, cap: 0, pts: 0, fg2: 0, fg3: 0, ft: 0, pf: 0, fouledOut: 0, high: 0, per: [0, 0, 0, 0], q4: 0, firstBasket: 0, games: [] });
  let teamPts = 0;
  seriesFilter(played, statComp).forEach(m => {
    if (!m.id || !PBP[m.id] || !LINEUPS[m.id]) return;
    const side = m.home ? "h" : "a";
    const ev = parseEvents(m.id).filter(e => e.side === side);
    const byNum = {};
    LINEUPS[m.id].forEach(([num, name, cap]) => {
      const p = get(name, num); p.nums.add(num); p.gp++; if (cap) p.cap++;
      byNum[num] = { p, g: { id: m.id, date: m.date, opp: m.opp, home: m.home, us: m.us, them: m.them, win: m.win, pts: 0, fg2: 0, fg3: 0, ft: 0, pf: 0, cap: !!cap } };
    });
    let first = true;
    ev.forEach(e => {
      const r = byNum[e.num]; if (!r) return;
      if (/^[123]$/.test(e.code)) {
        const v = +e.code; r.g.pts += v; r.p.per[Math.min(e.p, 4) - 1] += v; teamPts += v;
        if (v === 1) r.g.ft++; else if (v === 2) r.g.fg2++; else r.g.fg3++;
        if (first && v > 1) { r.p.firstBasket++; first = false; }
      } else if (e.code === "F") r.g.pf++;
    });
    Object.values(byNum).forEach(({ p, g }) => {
      p.pts += g.pts; p.fg2 += g.fg2; p.fg3 += g.fg3; p.ft += g.ft; p.pf += g.pf;
      if (g.pf >= 5) p.fouledOut++;
      p.high = Math.max(p.high, g.pts); p.games.push(g);
    });
  });
  // Squad members without a game yet
  SQUAD.forEach(([num, name]) => { if (!P[name]) { const p = get(name, num); if (num != null) p.nums.add(String(num)); } });
  const list = Object.values(P).map(p => ({ ...p, num: [...p.nums][0] || "", ppg: p.gp ? p.pts / p.gp : 0, pfpg: p.gp ? p.pf / p.gp : 0, share: teamPts ? p.pts / teamPts : 0, q4: p.per[3] }));
  return { list, teamPts };
}

let statSort = { key: "pts", dir: -1 };
let statComp = "alla";
let statWide = false;
const STAT_COLS = [
  { k: "gp", h: "M", t: "Matcher" },
  { k: "pts", h: "P", t: "Poäng" },
  { k: "ppg", h: "P/M", t: "Poäng per match", f: v => v.toFixed(1) },
  { k: "high", h: "Bäst", t: "Flest poäng i en match", wide: 1 },
  { k: "fg2", h: "2P", t: "Tvåpoängare" },
  { k: "fg3", h: "3P", t: "Trepoängare" },
  { k: "ft", h: "Str", t: "Straffar (1 poäng)" },
  { k: "share", h: "% lag", t: "Andel av lagets poäng", f: v => Math.round(v * 100) + "%", wide: 1 },
  { k: "q4", h: "P4", t: "Poäng i fjärde perioden", wide: 1 },
  { k: "pf", h: "F", t: "Personliga fouls" },
  { k: "pfpg", h: "F/M", t: "Fouls per match", f: v => v.toFixed(1), wide: 1 }
];

function statsTable() {
  const { list, teamPts } = buildStats();
  const rows = list.slice().sort((a, b) => {
    if (statSort.key === "name") return a.name.localeCompare(b.name, "sv") * (statSort.dir < 0 ? 1 : -1);
    if ((a.gp > 0) !== (b.gp > 0)) return a.gp > 0 ? -1 : 1;
    return (a[statSort.key] - b[statSort.key]) * statSort.dir || b.pts - a.pts || a.name.localeCompare(b.name, "sv");
  });
  const cols = STAT_COLS.filter(c => statWide || !c.wide);
  const games = seriesFilter(played, statComp).filter(m => LINEUPS[m.id]).length;
  const tot = k => list.reduce((s, p) => s + (p[k] || 0), 0);
  const arrow = k => statSort.key === k ? (statSort.dir < 0 ? " ↓" : " ↑") : "";
  return `
    <div class="tbl-wrap pstats ${statWide ? "wide" : ""}"><table>
      <thead><tr><th class="l">#</th><th class="l"><button type="button" class="sorth" data-sort="name">Spelare${arrow("name")}</button></th>
        ${cols.map(c => `<th title="${c.t}"><button type="button" class="sorth" data-sort="${c.k}">${c.h}${arrow(c.k)}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(p => `<tr class="prow ${p.gp ? "" : "dnp"}" data-player="${esc(p.name)}" tabindex="0">
        <td class="pos">${esc(p.num)}</td><td class="l team">${esc(p.name)}${p.cap ? ' <span class="capt" title="Kapten">K</span>' : ""}</td>
        ${cols.map(c => `<td>${p.gp ? (c.f ? c.f(p[c.k]) : p[c.k]) : "–"}</td>`).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td></td><td class="l">Laget (${games} matcher)</td>
        ${cols.map(c => `<td>${c.k === "pts" ? teamPts : c.k === "ppg" ? (teamPts / games).toFixed(1) : ["fg2", "fg3", "ft", "pf"].includes(c.k) ? tot(c.k) : c.k === "pfpg" ? (tot("pf") / games).toFixed(1) : c.k === "q4" ? tot("q4") : ""}</td>`).join("")}</tr></tfoot>
    </table></div>`;
}

function renderStats() {
  const el = document.getElementById("statsbox"); if (!el) return;
  const { list } = buildStats();
  const scorers = list.filter(p => p.gp);
  const lead = (k, f) => { const p = scorers.slice().sort((a, b) => b[k] - a[k])[0]; return p ? { p, v: f ? f(p[k]) : p[k] } : null; };
  const cards = [
    ["Flest poäng", lead("pts")], ["Poäng per match", lead("ppg", v => v.toFixed(1))],
    ["Flest trepoängare", lead("fg3")], ["Bästa match", lead("high")]
  ].filter(x => x[1]);
  el.innerHTML = `
    ${filterSeg("statseg", statComp)}
    <div class="leaders">${cards.map(([k, x]) => `<button type="button" class="leader" data-player="${esc(x.p.name)}"><span class="k">${k}</span><span class="v">${x.v}</span><span class="who">#${esc(x.p.num)} ${esc(x.p.name)}</span></button>`).join("")}</div>
    ${statsTable()}
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="toggle" id="statwide" type="button">${statWide ? "Färre kolumner" : "Fler kolumner"}</button>
      <span class="note">Tryck på en rubrik för att sortera, eller på en spelare för matchvis statistik.</span></div>
    <p class="note">Räknat från Profixios matchlogg och matchprotokoll. Där registreras gjorda poäng, fouls och vilka som var med, men inte returer, assist, missade skott eller speltid. Därför finns ingen skottprocent.</p>`;
  el.querySelectorAll(".sorth").forEach(b => b.addEventListener("click", () => { const k = b.dataset.sort; statSort = { key: k, dir: statSort.key === k ? -statSort.dir : -1 }; renderStats(); }));
  document.getElementById("statwide").addEventListener("click", () => { statWide = !statWide; renderStats(); });
  el.querySelectorAll("#statseg button").forEach(b => b.addEventListener("click", () => { statComp = b.dataset.f; renderStats(); }));
}

function openSeason() {
  if (!SHOW_LAGET || !PLAYER_STATS) return;
  backToStats = false;
  const el = document.getElementById("match");
  if (el.hidden) { const cur = tabs.find(t => t.getAttribute("aria-selected") === "true"); lastTab = cur ? cur.dataset.tab : "laget"; }
  el.innerHTML = `<button class="back" type="button" id="backbtn">← Tillbaka</button>
    <div><h1 class="page-title">Säsongsstatistik</h1><p class="lede">P11 Röd · Serie och USM · 2026/27</p></div>
    <div id="statsbox" style="display:grid;gap:14px"></div>`;
  document.getElementById("backbtn").addEventListener("click", closeMatch);
  document.querySelectorAll('section[role="tabpanel"]').forEach(s => s.hidden = true);
  el.hidden = false; window.scrollTo(0, 0);
  renderStats();
}
function openPlayer(name, rerender) {
  if (!SHOW_LAGET || !PLAYER_STATS) return;
  const fromStats = rerender ? backToStats : !!document.getElementById("statsbox") && !document.getElementById("match").hidden;
  const { list } = buildStats(); const p = list.find(x => x.name === name); if (!p) return;
  const maxPer = Math.max(1, ...p.per);
  const el = document.getElementById("match");
  el.innerHTML = `
    <button class="back" type="button" id="backbtn">← Tillbaka</button>
    ${filterSeg("pseg", statComp)}
    <div class="board pboard">${ball}
      <div class="meta">Spelare · P11 Röd${statComp !== "alla" ? " · " + FILTER_LABELS[statComp] : ""}${p.cap ? ` · kapten ${p.cap} ${p.cap === 1 ? "match" : "matcher"}` : ""}</div>
      <div class="phead">${photoOf(p.name) ? `<span class="avatar big"><img src="${photoOf(p.name)}" alt=""><b>${esc(p.num || "–")}</b></span>` : `<span class="jersey big-j">${esc(p.num || "–")}</span>`}<div><h2 class="pname">${esc(p.name)}</h2><div class="py">${p.gp} ${p.gp === 1 ? "match" : "matcher"}</div></div></div>
      <div class="stats">
        <div class="stat"><div class="k">Poäng</div><div class="v">${p.pts}</div></div>
        <div class="stat"><div class="k">Per match</div><div class="v">${p.ppg.toFixed(1)}</div></div>
        <div class="stat"><div class="k">Bästa</div><div class="v">${p.high}</div></div>
        <div class="stat"><div class="k">Fouls per match</div><div class="v">${p.gp ? (p.pf / p.gp).toFixed(1) : "–"}</div></div>
      </div>
    </div>
    ${p.gp ? `
    <div><h2 class="h2">Poäng uppdelning</h2>
      <div class="mix">${[["2P", p.fg2, 2], ["3P", p.fg3, 3], ["Straffkast", p.ft, 1]].map(([k, n, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${n}</div><div class="py">${n * v} poäng</div></div>`).join("")}</div></div>
    <div><h2 class="h2">Poäng per period</h2>
      <div class="perbars">${p.per.map((v, i) => `<div class="pb"><span class="pv">${v}</span><span class="pbar"><i style="height:${(v / maxPer * 100).toFixed(0)}%"></i></span><span class="pk">P${i + 1}</span></div>`).join("")}</div></div>
    <div><h2 class="h2">Match för match</h2>
      <div class="tbl-wrap"><table><thead><tr><th class="l">Match</th><th>P</th><th>2P</th><th>3P</th><th>Str</th><th>F</th></tr></thead>
      <tbody>${p.games.slice().reverse().map(g => { const d = d8(g.date); return `<tr><td class="l"><button type="button" class="glink" data-match="${g.id}">${d.getDate()} ${MON[d.getMonth()]} · ${esc(g.opp)}</button><div class="py">${g.home ? "Hemma" : "Borta"} · <span class="pill mini ${g.win ? "w" : "l"}">${g.win ? "V" : "F"}</span> <span class="${g.win ? "plus" : "minus"}">${g.us}–${g.them}</span>${g.cap ? " · kapten" : ""}</div></td><td><b>${g.pts}</b></td><td>${g.fg2}</td><td>${g.fg3}</td><td>${g.ft}</td><td class="${g.pf >= 5 ? "minus" : ""}">${g.pf}</td></tr>`; }).join("")}</tbody></table></div></div>
    ${p.fouledOut ? `<p class="note">Utvisad på fem fouls i ${p.fouledOut} ${p.fouledOut === 1 ? "match" : "matcher"}.</p>` : ""}` : `<p class="note">Inte med i någon match ${statComp === "alla" ? "ännu den här säsongen" : "i " + FILTER_LABELS[statComp] + " ännu"}.</p>`}`;
  backToStats = fromStats;
  el.querySelectorAll("#pseg button").forEach(b => b.addEventListener("click", () => { statComp = b.dataset.f; openPlayer(name, true); }));
  document.getElementById("backbtn").addEventListener("click", closeMatch);
  const cur = tabs.find(t => t.getAttribute("aria-selected") === "true");
  if (document.getElementById("match").hidden) lastTab = cur ? cur.dataset.tab : "laget";
  document.querySelectorAll('section[role="tabpanel"]').forEach(s => s.hidden = true);
  el.hidden = false; window.scrollTo(0, 0);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-player]"); if (b) openPlayer(b.dataset.player); });
document.addEventListener("keydown", e => { if (e.key === "Enter") { const tl = e.target.closest && e.target.closest("[data-table]"); if (tl) { goTable(tl.dataset.table); return; } const b = e.target.closest && e.target.closest("tr[data-player], li[data-player]"); if (b) openPlayer(b.dataset.player); const mm = e.target.closest && e.target.closest(".sbg[data-match], .sbx[data-match]"); if (mm) openMatch(mm.dataset.match); } });
document.addEventListener("click", e => { if (e.target.closest("#openstats")) openSeason(); });


let start = (location.hash || "").slice(1);
if (!start) { try { start = localStorage.getItem("tab") || ""; } catch (e) {} }
show(start || "oversikt");

/* Restore the view after an automatic refresh. */
try {
  const v = JSON.parse(sessionStorage.getItem("p11-view") || "null");
  sessionStorage.removeItem("p11-view");
  if (v) { if (v.match) openMatch(v.match); window.scrollTo(0, v.y || 0); }
} catch (e) {}

/* Keep the data fresh: fetch data.json (written by the GitHub Action) and refresh the page when it has changed.
   Checks on open, every 15 minutes, and every minute around game time. Silently does nothing where data.json isn't available. */
(function keepFresh() {
  if (!/^https?:$/.test(location.protocol)) return;
  const sig = d => JSON.stringify(Object.assign({}, d, { updated: 0 }));
  const curSig = FRESH ? sig(FRESH) : "";
  const gameTime = () => { const t = Date.now(); return matches.some(m => !m.played && m.time && Math.abs(t - new Date(`${m.date}T${m.time}`).getTime() - 45 * 60000) < 90 * 60000); };
  const status = () => fetch("status.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(st => {
    if (!st || !st.lastCheck) return;
    try { localStorage.setItem("p11-checked", st.lastCheck); } catch (e) {}
    const c = document.getElementById("upd-check");
    if (c && st.lastCheck > DATA.updated) c.innerHTML = ` · kontrollerad <b>${fmtStamp(st.lastCheck)}</b>`;
  }).catch(() => {});
  const check = () => (status(), fetch("data.json?t=" + Date.now(), { cache: "no-store" })).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !d.updated || !(d.updated > EMBED_UPDATED) || !d.series) return;
    try { localStorage.setItem("p11-data", JSON.stringify(d)); } catch (e) { return; }
    if (sig(d) === curSig) { const b = document.getElementById("upd-data"); if (b) b.textContent = fmtStamp(d.updated); return; }
    try { sessionStorage.setItem("p11-view", JSON.stringify({ match: !document.getElementById("match").hidden ? window.__openMatch : null, y: window.scrollY })); } catch (e) {}
    location.reload();
  }).catch(() => {});
  check();
  let n = 0;
  setInterval(() => { n++; if (matches.some(m => m.live) || gameTime() || n % 15 === 0) check(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
})();
</script>
